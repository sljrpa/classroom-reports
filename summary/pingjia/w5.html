.cls:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,0.12);}
.cls.c1{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}

.cls.c3{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;}

.cls .name{font-size:20px;font-weight:700;letter-spacing:1px;}
