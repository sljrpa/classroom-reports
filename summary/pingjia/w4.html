<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W4 班级选择</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#2c3e50;line-height:1.7;}
.topbar{max-width:960px;margin:0 auto;padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center;}
.topbar .back{font-size:13px;color:#7f8c8d;text-decoration:none;padding:6px 14px;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.topbar .back:hover{color:#3498db;}
.container{max-width:960px;margin:0 auto;padding:12px 20px 30px;}
.title{text-align:center;font-size:22px;font-weight:700;color:#2c3e50;margin-bottom:24px;}
.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.06);}
.intro{font-size:15px;line-height:1.9;color:#555;padding:18px 22px;background:linear-gradient(135deg,#fdf8ff,#f5eef8);border-radius:12px;border-left:4px solid #e67e22;margin-bottom:24px;}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:700px){.cols{grid-template-columns:1fr;}}
.cls{border-radius:14px;padding:28px 24px;text-decoration:none;text-align:center;transition:all .2s ease;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.5;pointer-events:none;}
.cls.c1{background:linear-gradient(135deg,#ebf5fb,#d6eaf8);color:#2874a6;}
.cls.c3{background:linear-gradient(135deg,#eafaf1,#d5f5e3);color:#1e8449;}
.cls .num{font-size:36px;font-weight:800;opacity:.15;}
.cls .name{font-size:18px;font-weight:700;}
.cls .desc{font-size:13px;opacity:.7;}
.empty{text-align:center;padding:40px 20px;color:#95a5a6;font-size:15px;}
</style>
</head>
<body>
<div class="topbar"><span></span><a class="back" href="class.html">← 返回</a></div>
<div class="container">
<div class="title">📋 W4 班级报告 <span style="font-size:14px;color:#888;font-weight:400;">日期待补</span></div>
<div class="card">
<div class="intro">选择班级，查看该班第4周课堂表现报告。</div>
<div class="empty">📭 暂无报告，待上传</div>
</div>
</div>
</body>
</html>
