<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第4周 — 选择班级</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:#f5f7fa;color:#2c3e50;line-height:1.7;}
.topbar{max-width:960px;margin:0 auto;padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center;}
.topbar .back{font-size:13px;color:#7f8c8d;text-decoration:none;padding:6px 14px;border-radius:8px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.topbar .back:hover{color:#3498db;}
.container{max-width:960px;margin:0 auto;padding:12px 20px 30px;}
.title{font-size:22px;font-weight:700;color:#2c3e50;text-align:center;margin-bottom:24px;}
.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.06);margin-bottom:24px;}
.card-title{font-size:17px;font-weight:700;color:#2c3e50;margin-bottom:24px;padding-bottom:14px;border-bottom:2px solid #eee;}
.clist{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:600px){.clist{grid-template-columns:1fr;}}
.cbtn{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:18px 22px;text-decoration:none;color:#2c3e50;box-shadow:0 2px 12px rgba(0,0,0,0.05);transition:all .2s ease;border:1px solid transparent;}
.cbtn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.1);border-color:#e0e0e0;}
.cbtn .ico{font-size:28px;}
.cbtn b{font-size:16px;display:block;}
.cbtn span{font-size:13px;color:#888;}
</style>
</head>
<body>
<div class="topbar">
<span></span>
<a class="back" href="../pingjia.html">← 返回周次</a>
</div>
<div class="container">
<div class="title">第4周 · 选择班级</div>
<div class="card">
<div class="card-title">选择班级查看报告</div>
<div class="clist">
  <a class="cbtn" href="#" onclick="alert('第4周一班报告待上传');return false;">
    <span class="ico">📘</span>
    <div><b>一班</b><br><span>暂无报告</span></div>
  </a>
  <a class="cbtn" href="#" onclick="alert('第4周三班报告待上传');return false;">
    <span class="ico">📗</span>
    <div><b>三班</b><br><span>暂无报告</span></div>
  </a>
</div>
</div>
</div>
</body>
</html>
