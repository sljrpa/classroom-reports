<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水平2 - 各模块水平分级习题</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:#f5f7fa;color:#2c3e50;line-height:1.7;}
.container{max-width:960px;margin:0 auto;padding:20px;}
.title{font-size:22px;font-weight:700;color:#2c3e50;padding:0 0 12px 0;border-bottom:2px solid #ecf0f1;margin-bottom:20px;}
.count{display:inline-block;background:#f4ecf7;color:#7d3c98;font-size:12px;font-weight:600;padding:2px 10px;border-radius:10px;margin-left:8px;}
.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.06);margin-bottom:20px;}
.empty{text-align:center;padding:40px 20px;color:#aaa;font-size:15px;}
.back{display:inline-block;font-size:13px;color:#7f8c8d;text-decoration:none;padding:8px 0;margin-top:8px;}
.back:hover{color:#3498db;}
</style>
</head>
<body>
<div class="container">
<div class="title">🟣 水平2</div>
<div class="card">
<div class="empty">暂无习题文件，后续更新</div>
</div>
<a class="back" href="../stats.html">← 返回水平分级</a>
</div>

<!-- 浏览量计数器 -->
<p id="view-counter" style="text-align:center;font-size:11px;color:#bdc3c7;padding:8px 0 4px;">本页访问 <span id="vc-num">--</span> 次</p>
<script>
(function(){
  var path = window.location.pathname.replace(/[^a-zA-Z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  fetch('https://api.counterapi.dev/v1/sljrpa/' + path + '/up')
    .then(function(r){return r.json()})
    .then(function(d){document.getElementById('vc-num').textContent=d.count})
    .catch(function(){});
})();
</script>
</body>
</html>
