<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>模块二 复数</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#525659;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid #e8ecef;position:sticky;top:0;z-index:10;gap:8px;}
.back-btn{display:flex;align-items:center;padding:6px 12px;border-radius:8px;text-decoration:none;font-size:13px;color:#7f8c8d;background:#f5f7fa;white-space:nowrap;}
.back-btn:hover{background:#e8ecef;}
.pdf-title{font-size:14px;font-weight:600;color:#2c3e50;text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dl-btn{display:flex;align-items:center;gap:4px;padding:6px 14px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:500;color:#fff;background:linear-gradient(135deg,#3498db,#2980b9);white-space:nowrap;box-shadow:0 2px 6px rgba(52,152,219,0.3);}
.dl-btn:hover{background:linear-gradient(135deg,#2980b9,#2471a3);}
#canvas-container{display:flex;flex-direction:column;align-items:center;padding:10px 0;}
canvas{max-width:100%;height:auto;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
.loading{text-align:center;padding:60px 20px;color:#fff;font-size:16px;}
</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="../水平0.html">← 返回</a>
  <span class="pdf-title">模块二 复数</span>
  <a class="dl-btn" href="../水平0/模块二_复数.pdf" download>⬇ 下载</a>
</div>
<div id="canvas-container">
  <div class="loading" id="loading">正在加载文档...</div>
</div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const url=decodeURI('../水平0/模块二_复数.pdf');
async function renderPDF(){
  const loading=document.getElementById('loading');
  try{
    const pdf=await pdfjsLib.getDocument(url).promise;
    loading.style.display='none';
    const container=document.getElementById('canvas-container');
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const vw=window.innerWidth-20;
      const vp=page.getViewport({scale:1});
      const scale=vw/vp.width;
      const viewport=page.getViewport({scale:scale});
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d');
      canvas.height=viewport.height;
      canvas.width=viewport.width;
      container.appendChild(canvas);
      await page.render({canvasContext:ctx,viewport:viewport}).promise;
    }
  }catch(e){
    loading.textContent='加载失败，请点击下载按钮下载查看';
    console.error('PDF load error:',e);
  }
}
renderPDF();
</script>

<!-- 浏览量计数器 -->
<p id="view-counter" style="text-align:center;font-size:11px;color:#bdc3c7;padding:8px 0 4px;">本页访问 <span id="vc-num">--</span> 次</p>
<script>
(function(){
  var path = window.location.pathname.replace(/[^a-zA-Z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  fetch('https://api.counterapi.dev/v1/sljrpa/' + path + '/up')
    .then(function(r){return r.json()})
    .then(function(d){document.getElementById('vc-num').textContent=d.count})
    .catch(function(){});
})();
</script>
</body>
</html>
