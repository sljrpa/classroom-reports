<head>

<title>高考真题分级</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:#f5f7fa;color:#2c3e50;line-height:1.7;}
.container{max-width:960px;margin:0 auto;padding:20px;}
.title{font-size:22px;font-weight:700;color:#2c3e50;padding:0 0 12px 0;border-bottom:2px solid #ecf0f1;margin-bottom:20px;}
.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,0.06);margin-bottom:20px;}
.intro{font-size:15px;line-height:1.9;color:#555;padding:20px 24px;background:linear-gradient(135deg,#fffbf5,#fef5e7);border-radius:12px;border-left:4px solid #e67e22;margin-bottom:24px;}
.ft{font-size:16px;font-weight:600;color:#2c3e50;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid #ecf0f1;}
.links{display:flex;flex-direction:column;gap:12px;}
.lk{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:12px;text-decoration:none;transition:all .2s ease;font-weight:500;}
.lk .ic{font-size:20px;}
.lk:hover{transform:translateX(4px);}
.lk.orange{background:linear-gradient(135deg,#fef5e7,#fdebd0);color:#ca6f1e;}.lk.orange:hover{background:linear-gradient(135deg,#fdebd0,#f9cb9c);}
.lk.blue{background:linear-gradient(135deg,#ebf5fb,#d6eaf8);color:#2874a6;}.lk.blue:hover{background:linear-gradient(135deg,#d6eaf8,#aed6f1);}
.back{display:inline-block;font-size:13px;color:#7f8c8d;text-decoration:none;padding:8px 0;margin-top:8px;}
.back:hover{color:#3498db;}
</style>
</head>
<body>
<div class="container">
<div class="title">📝 高考真题分级</div>
<div class="card">
<div class="intro">
  <b>【资源储备】11年高考真题的系统化整理与分级</b><br>
  搜集了近11年（2015-2025）全国各卷高考真题，共计1150道题。按高中数学11个核心模块进行分类整理，并依据2025版课标的四级水平体系（水平零、水平一A、水平一B、水平二A、水平二B）对每道题进行标注。其中重点析出了水平一层次的题目，作为学生基础过关训练的核心题库，为后续课堂教学与考试评价提供精准的题目资源支撑。
</div>
<div class="ft">📂 研究成果</div>
