<div class="intro">
  <b>【过程追踪】从行为记录到自主管理的进阶体系</b><br>
  为学生定义了明确的正向行为（作答、质疑、展讲）与负向行为（注意力不集中、上课睡觉），并建立积分规则。两个班积累了集中的过程性数据，逐步实现了从基本行为记录→行为类型积分→学生行为跟踪→行为越级认定→小组自主KPI制定的五层递进。其中质疑数量增长最为显著，从最初的个位数逐步增加，反映出学生批判性思维的持续激活。
</div>
